<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bolão Copa do Mundo 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilo.css">

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🔥 FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>

<body>

<header>
    <h1>🏆 Bolão Copa do Mundo 2026</h1>
    <p>Última atualização: <strong id="ultimaAtualizacao">--/--/----</strong></p>
</header>

<!-- MENU TOPO -->
<nav class="menu-topo">
    <div class="menu-esquerda">
        <button onclick="mostrarAba('ranking')">Ranking</button>
        <button onclick="mostrarAba('rodadas')">Rodadas</button>
    </div>

    <div class="menu-direita">
        <a href="regras.html" class="btn-topo">📋 Regras</a>
    </div>
</nav>

<main>

    <!-- ABA RANKING -->
    <section id="aba-ranking">
        <h2>Ranking Geral</h2>

        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Participante</th>
                    <th>Pontos</th>
                </tr>
            </thead>
            <tbody id="tabelaRanking"></tbody>
        </table>
    </section>

    <!-- ABA RODADAS -->
    <section id="aba-rodadas" style="display:none;">
        <h2>Rodadas da Copa</h2>

        <nav style="margin-bottom: 15px;">
            <button onclick="mostrarRodada('grupos')">Fase de Grupos</button>
            <button onclick="mostrarRodada('eliminatorias')">Eliminatórias</button>
        </nav>

        <!-- GRUPOS -->
        <section id="rodada-grupos">
            <h3>Fase de Grupos</h3>
            <div id="gruposContainer"></div>
        </section>

        <!-- ELIMINATÓRIAS -->
        <section id="rodada-eliminatorias" style="display:none;">
            <h3>Fase Eliminatória</h3>
            <div id="eliminatoriasContainer"></div>
        </section>

    </section>

</main>

<footer>
    <p>
        © 2026 - Bolão Copa do Mundo
    </p>
</footer>

<!-- JS DA PÁGINA -->
<!-- ========================== -->
<script>
function mostrarAba(aba) {
    document.getElementById("aba-ranking").style.display = "none";
    document.getElementById("aba-rodadas").style.display = "none";

    document.getElementById("aba-" + aba).style.display = "block";
}

function mostrarRodada(tipo) {
    document.getElementById("rodada-grupos").style.display = "none";
    document.getElementById("rodada-eliminatorias").style.display = "none";

    document.getElementById("rodada-" + tipo).style.display = "block";
}
</script>
