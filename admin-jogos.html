<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin - Resultados</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="admin">

<header>
    <h1>⚙️ Administração de Jogos</h1>
    <p>Inserir resultados da Copa</p>
</header>

<main>

    <section>
        <h2>Atualizar Resultado</h2>

        <div class="form-linha">
            <select id="jogoSelect"></select>
        </div>

        <div class="form-linha">
            <input type="number" id="gols1" placeholder="Gols Time 1">
            <input type="number" id="gols2" placeholder="Gols Time 2">
        </div>

        <button onclick="salvarResultado()">Salvar Resultado</button>
    </section>

    <section>
        <h2>Jogos Atualizados</h2>
        <ul id="listaJogos"></ul>
    </section>

    <section>
        <button onclick="exportarJogos()">Exportar jogos.json</button>
    </section>

</main>

<script>
let jogos = [];

// CARREGAR JOGOS
fetch("dados/jogos.json")
  .then(res => res.json())
  .then(data => {
      jogos = data;
      popularSelect();
      renderLista();
  });

// POPULAR SELECT
function popularSelect() {
    const select = document.getElementById("jogoSelect");
    select.innerHTML = "";

    jogos.forEach((j, i) => {
        const option = document.createElement("option");

        option.value = i;
        option.textContent = `${j.selecao1} x ${j.selecao2}`;

        select.appendChild(option);
    });
}

// SALVAR RESULTADO
function salvarResultado() {
    const index = document.getElementById("jogoSelect").value;

    jogos[index].gols1 = parseInt(document.getElementById("gols1").value);
    jogos[index].gols2 = parseInt(document.getElementById("gols2").value);
    jogos[index].status = "encerrado";

    renderLista();
}

// LISTA VISUAL
function renderLista() {
    const ul = document.getElementById("listaJogos");
    ul.innerHTML = "";

    jogos.forEach(j => {
        const li = document.createElement("li");

        const placar = j.gols1 === null ? "— x —" : `${j.gols1} x ${j.gols2}`;

        li.textContent = `${j.selecao1} ${placar} ${j.selecao2} (${j.status})`;

        ul.appendChild(li);
    });
}

// EXPORTAR JSON
function exportarJogos() {
    const blob = new Blob([JSON.stringify(jogos, null, 2)], {
        type: "application/json"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "jogos.json";
    a.click();
}
</script>

</body>
</html>
