<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Administração do Bolão</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilo.css">

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>

<body class="admin">

<!-- HEADER -->
<header></header>

<!-- CONTAINER CORRETO -->
<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
       
 <div class="menu">

        <a href="index.html" class="menu-item">
            🏆 Ranking
        </a>

        <a href="regras.html" class="menu-item">
            📋 Regras
        </a>

        <div class="menu-item ativo">⚙️ Admin</div>

        <!-- SUBMENU ADMIN -->
       
 <div class="menu">

        <button class="menu-item ativo" onclick="mostrarAba('participantes')">
            👥 Participantes
        </button>

        <button class="menu-item" onclick="mostrarAba('palpites')">
            🎯 Palpites
        </button>

        <button class="menu-item" onclick="mostrarAba('resultados')">
            ⚽ Resultados
        </button>

    </div>


    </aside>

    <!-- CONTEÚDO -->
    <main>

       document.querySelectorAll('nav .menu-item')

        <!-- PARTICIPANTES -->
        <section id="aba-participantes">
            <h2>Participantes</h2>

            <input type="text" id="nomeParticipante" placeholder="Nome">
            <button onclick="adicionarParticipante()">Adicionar</button>

            <ul id="listaParticipantes"></ul>
        </section>

        <!-- PALPITES -->
        <section id="aba-palpites" style="display:none;">
            <h2>Palpites</h2>

            <label>Participante:</label>
            <select id="selectParticipante"></select>

            <div id="listaPalpites"></div>

            <button onclick="salvarPalpites()">Salvar Palpites</button>
        </section>

        <!-- RESULTADOS -->
        <section id="aba-resultados" style="display:none;">
            <h2>Resultados dos Jogos</h2>

            <div id="listaJogos"></div>
        </section>

    </main>

</div>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyA65IJsycu-tBDu1ZJ2FDXWSRoxetq091I",
  authDomain: "bolao-copa-2026-b39f1.firebaseapp.com",
  databaseURL: "https://bolao-copa-2026-b39f1-default-rtdb.firebaseio.com",
  projectId: "bolao-copa-2026-b39f1",
  storageBucket: "bolao-copa-2026-b39f1.firebasestorage.app",
  messagingSenderId: "47483489037",
  appId: "1:47483489037:web:dd956178aa5eaf1e677e44"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ABAS

 const abas = ["participantes", "palpites", "resultados"];

    // esconder todas
    abas.forEach(a => {
        document.getElementById("aba-" + a).style.display = "none";
    });

    // mostrar selecionada
    document.getElementById("aba-" + aba).style.display = "block";

    // remover ativo de todos os botões da sidebar
    document.querySelectorAll('.sidebar .menu-item').forEach(btn => {
        btn.classList.remove('ativo');
    });

    // ativar o botão clicado
    if (aba === "participantes") {
        document.querySelectorAll('.sidebar .menu-item')[0].classList.add("ativo");
    }

    if (aba === "palpites") {
        document.querySelectorAll('.sidebar .menu-item')[1].classList.add("ativo");
    }

    if (aba === "resultados") {
        document.querySelectorAll('.sidebar .menu-item')[2].classList.add("ativo");
    }

    // manter lógica existente
    if (aba === "palpites") {
        carregarParticipantesSelect();
        carregarPalpites();
    }
}

// PARTICIPANTES
function adicionarParticipante() {
    const input = document.getElementById("nomeParticipante");
    const nome = input.value.trim();

    if (!nome) return;

    db.ref("participantes/" + nome).set({ nome });

    input.value = "";
    carregarParticipantes();
}

function carregarParticipantes() {
    const ul = document.getElementById("listaParticipantes");
    ul.innerHTML = "";

    db.ref("participantes").once("value", snapshot => {
        const dados = snapshot.val();
        if (!dados) return;

        Object.keys(dados).forEach(key => {
            const li = document.createElement("li");
            li.textContent = dados[key].nome;

            const btn = document.createElement("button");
            btn.textContent = "Remover";
            btn.onclick = () => removerParticipante(key);

            li.appendChild(btn);
            ul.appendChild(li);
        });
    });
}

function removerParticipante(nome) {
    if (!confirm("Deseja mesmo remover este participante?")) return;

    db.ref("participantes/" + nome).remove();
    carregarParticipantes();
}

// RESULTADOS
const jogos = [
    { id: "J1", selecao1: "Brasil", selecao2: "Japão" },
    { id: "J2", selecao1: "Argentina", selecao2: "Canadá" }
];

function carregarJogos() {
    const container = document.getElementById("listaJogos");
    container.innerHTML = "";

    jogos.forEach(jogo => {
        const div = document.createElement("div");

        div.innerHTML = `
            <strong>${jogo.selecao1} x ${jogo.selecao2}</strong><br>
            <input type="number" id="g1-${jogo.id}" placeholder="0" style="width:50px;">
            x
            <input type="number" id="g2-${jogo.id}" placeholder="0" style="width:50px;">
            <button onclick="salvarResultado('${jogo.id}')">Salvar</button>
            <hr>
        `;

        container.appendChild(div);
    });
}

function salvarResultado(jogoId) {
    const g1 = document.getElementById("g1-" + jogoId).value;
    const g2 = document.getElementById("g2-" + jogoId).value;

    if (g1 === "" || g2 === "") {
        alert("Preencha os dois placares");
        return;
    }

    const jogo = jogos.find(j => j.id === jogoId);

    db.ref("jogos/" + jogoId).once("value").then(snap => {
        const dados = snap.val();

        if (dados && dados.finalizado) {
            alert("Este jogo já está finalizado.");
            return;
        }

        db.ref("jogos/" + jogoId).set({
            selecao1: jogo.selecao1,
            selecao2: jogo.selecao2,
            gols1: parseInt(g1),
            gols2: parseInt(g2),
            finalizado: true
        });

        alert("Resultado salvo ✅");
    });
}

// PALPITES
const jogosPalpites = [
    { id: "J1", selecao1: "Brasil", selecao2: "Japão" },
    { id: "J2", selecao1: "Argentina", selecao2: "Canadá" }
];

function carregarParticipantesSelect() {
    const select = document.getElementById("selectParticipante");
    select.innerHTML = "";

    db.ref("participantes").once("value", snapshot => {
        const dados = snapshot.val();
        if (!dados) return;

        for (let key in dados) {
            const option = document.createElement("option");
            option.value = key;
            option.textContent = dados[key].nome;
            select.appendChild(option);
        }
    });
}

function carregarPalpites() {
    const container = document.getElementById("listaPalpites");
    container.innerHTML = "";

    jogosPalpites.forEach(jogo => {
        const div = document.createElement("div");

        div.innerHTML = `
            <strong>${jogo.selecao1} x ${jogo.selecao2}</strong><br>
            <input type="number" id="p1-${jogo.id}" placeholder="0" style="width:50px;">
            x
            <input type="number" id="p2-${jogo.id}" placeholder="0" style="width:50px;">
            <hr>
        `;

        container.appendChild(div);
    });
}

function salvarPalpites() {
    const participante = document.getElementById("selectParticipante").value;

    if (!participante) {
        alert("Selecione um participante");
        return;
    }

    jogosPalpites.forEach(jogo => {
        const g1 = document.getElementById("p1-" + jogo.id).value;
        const g2 = document.getElementById("p2-" + jogo.id).value;

        if (g1 === "" || g2 === "") return;

        db.ref(`palpites/${participante}/${jogo.id}`).set({
            gols1: parseInt(g1),
            gols2: parseInt(g2)
        });
    });

    alert("Palpites salvos ✅");
}

// INIT
window.onload = () => {
    carregarParticipantes();
    carregarJogos();
    carregarParticipantesSelect();
    carregarPalpites();
};

</script>

</body>
</html>
